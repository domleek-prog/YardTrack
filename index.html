<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YardTrack</title>

<script>
  // Dark is the default; light only if chosen in-app. Set before paint to avoid a flash.
  try { if (localStorage.getItem('yt.theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}
</script>
<style>
:root {
  --bg: #0a0c0f;
  --surface: #13161b;
  --surface-2: #1b1f26;
  --line: #262b34;
  --text: #eef0f3;
  --muted: #8b93a1;
  --faint: #5a6270;
  --accent: #ffb020;
  --on-accent: #111;
  --good: #2fd67b;
  --bad: #ff4d5e;
  --fill: #d9dee6;
  --track: #252a33;
  --good-bg: rgba(47, 214, 123, .07);
  --bad-bg: rgba(255, 77, 94, .07);
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.35);
  --scrim: rgba(0,0,0,.6);
  --toast-bg: #eef0f3;
  --toast-text: #0a0c0f;
  --toast-action: #b87400;
  --radius: 18px;
  --gutter: 16px;
  --font: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --num: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f3f4f6;
  --surface: #ffffff;
  --surface-2: #eef0f3;
  --line: #e1e4e9;
  --text: #0d1117;
  --muted: #5d6573;
  --faint: #9aa1ad;
  --accent: #f5a300;
  --good: #0f9f4f;
  --bad: #e0344a;
  --fill: #2a303a;
  --track: #e4e7ec;
  --good-bg: rgba(15, 159, 79, .06);
  --bad-bg: rgba(224, 52, 74, .06);
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 6px 18px rgba(16,24,40,.06);
  --scrim: rgba(15,18,24,.4);
  --toast-bg: #0d1117;
  --toast-text: #f3f4f6;
  --toast-action: #ffc24d;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.35;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  min-height: 100dvh;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }

/* ---------- Header ---------- */
.top {
  position: sticky; top: 0; z-index: 10;
  padding: calc(env(safe-area-inset-top) + 10px) calc(var(--gutter) + env(safe-area-inset-right)) 10px calc(var(--gutter) + env(safe-area-inset-left));
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  -webkit-backdrop-filter: saturate(160%) blur(14px);
  backdrop-filter: saturate(160%) blur(14px);
  border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent);
}
.top-inner, main, .toolbar { max-width: 560px; margin: 0 auto; }
.top-inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--num); font-weight: 700; font-size: 22px; letter-spacing: .06em; text-transform: uppercase; }
.brand svg { width: 26px; height: 26px; flex: none; }
.brand b { color: var(--accent); font-weight: 700; }
.top-right { display: flex; align-items: center; gap: 4px; }
.fresh { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.fresh i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.fresh.ok i { background: var(--good); }
.fresh.warn i { background: var(--accent); }
.theme-btn { width: 36px; height: 36px; margin-right: -8px; }
.theme-btn svg { width: 19px; height: 19px; }
.netwarn {
  max-width: 560px; margin: 8px auto 0; font-size: 12.5px; color: var(--accent);
  display: flex; align-items: center; gap: 6px;
}
.netwarn svg { width: 14px; height: 14px; flex: none; }

/* ---------- Toolbar ---------- */
.toolbar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px calc(var(--gutter) + env(safe-area-inset-right)) 4px calc(var(--gutter) + env(safe-area-inset-left));
}
.tally { display: flex; gap: 14px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.tally span b { color: var(--text); font-family: var(--num); font-size: 15px; margin-right: 4px; letter-spacing: 0; }
.tally .t-live b { color: var(--accent); }
.tally .t-won b { color: var(--good); }
.tally .t-lost b { color: var(--bad); }
.ghost {
  background: none; border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap;
}
.ghost:active { background: var(--surface-2); }

/* ---------- Bet slips ---------- */
main {
  padding: 8px calc(var(--gutter) + env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) calc(var(--gutter) + env(safe-area-inset-left));
  display: grid; gap: 14px;
}
.slip {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  transition: border-color .3s;
}
.slip.won { border-color: color-mix(in srgb, var(--good) 55%, var(--line)); }
.slip.lost { border-color: color-mix(in srgb, var(--bad) 55%, var(--line)); }
.s-head {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 10px 10px 14px; border-bottom: 1px solid var(--line);
}
.s-name {
  display: flex; align-items: center; gap: 6px; min-width: 0; border: 0; background: none; padding: 0;
  font-family: var(--num); font-weight: 700; font-size: 21px; letter-spacing: .05em; text-transform: uppercase;
}
.s-name span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s-name svg { width: 14px; height: 14px; color: var(--faint); flex: none; }
.s-count { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.s-spacer { flex: 1; }
.badge { font-size: 11px; font-weight: 700; letter-spacing: .12em; padding: 4px 8px; border-radius: 6px; text-transform: uppercase; white-space: nowrap; }
.badge.good { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
.badge.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
.badge.live { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.badge.push, .badge.pending { color: var(--muted); background: var(--surface-2); }
.del-btn {
  width: 32px; height: 32px; border: 0; background: none; border-radius: 10px; flex: none;
  color: var(--faint); display: grid; place-items: center;
}
.del-btn:hover, .del-btn:active { color: var(--bad); background: var(--surface-2); }
.del-btn svg { width: 18px; height: 18px; }

.s-legs { display: grid; }
.s-empty { padding: 18px 14px 6px; color: var(--muted); font-size: 14px; }
.s-add {
  display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%;
  height: 46px; border: 0; border-top: 1px solid var(--line); background: none;
  color: var(--accent); font-weight: 700; font-size: 14px; letter-spacing: .08em; text-transform: uppercase;
}
.s-add:active { background: var(--surface-2); }
.s-add svg { width: 16px; height: 16px; }

/* ---------- Leg (player line) ---------- */
.leg { position: relative; padding: 12px 14px 10px; border-top: 1px solid var(--line); transition: background-color .3s; }
.leg:first-child { border-top: 0; }
.leg::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: transparent; transition: background .3s; }
.leg.good { background: var(--good-bg); }
.leg.bad { background: var(--bad-bg); }
.leg.good::before { background: var(--good); }
.leg.bad::before { background: var(--bad); }
.leg.flash { animation: flash .9s ease-out; }
@keyframes flash { 0% { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--accent) 70%, transparent); } 100% { box-shadow: inset 0 0 0 2px transparent; } }

.l-head { display: grid; grid-template-columns: 42px 1fr auto; gap: 11px; align-items: center; }
.avatar {
  width: 42px; height: 42px; border-radius: 50%; overflow: hidden; background: var(--surface-2);
  display: grid; place-items: center; position: relative; flex: none;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%; transform: scale(1.25); transform-origin: 50% 20%; }
.avatar.noimg::after { content: attr(data-initials); font-family: var(--num); font-weight: 700; font-size: 16px; color: var(--muted); letter-spacing: .03em; }
.l-who { min-width: 0; }
.l-name { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.l-name small { font-size: 12.5px; font-weight: 500; color: var(--muted); margin-left: 4px; }
.l-bet { font-family: var(--num); font-size: 16px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.l-bet .side { color: var(--accent); margin-right: 2px; }
.l-val { text-align: right; line-height: .82; }
.l-val .yds { font-family: var(--num); font-weight: 700; font-size: 48px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; display: block; transition: color .3s; }
.l-val .yds.dim { color: var(--faint); }
.l-val .unit { font-size: 10px; font-weight: 700; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
.leg.good .yds { color: var(--good); }
.leg.bad .yds { color: var(--bad); }

.bar { position: relative; height: 8px; margin-top: 10px; border-radius: 999px; background: var(--track); overflow: hidden; }
.bar .fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: inherit; background: var(--fill); transition: width .6s cubic-bezier(.2,.8,.2,1), background .3s; }
.leg.good .fill { background: var(--good); }
.leg.bad .fill { background: var(--bad); }
.bar .ticks { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), color-mix(in srgb, var(--bg) 55%, transparent) calc(10% - 1px) 10%); pointer-events: none; }
.bar.td .ticks { display: none; }

.l-foot { display: flex; align-items: center; gap: 8px; margin-top: 8px; min-height: 26px; }
.l-status { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.l-status .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; animation: pulse 1.8s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 70%, transparent); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.l-status .score { color: var(--text); font-weight: 600; }
.l-delta { font-family: var(--num); font-size: 15px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.leg.good .l-delta { color: var(--good); }
.leg.bad .l-delta { color: var(--bad); }
.leg .del-btn { width: 28px; height: 28px; margin-right: -6px; }
.leg .del-btn svg { width: 16px; height: 16px; }

/* ---------- Empty ---------- */
.empty { text-align: center; padding: 64px 24px 24px; color: var(--muted); }
.empty svg { width: 88px; height: 88px; margin-bottom: 14px; }
.empty h2 { font-family: var(--num); text-transform: uppercase; letter-spacing: .05em; font-size: 26px; color: var(--text); margin: 0 0 6px; }
.empty p { margin: 0 auto; max-width: 290px; font-size: 15px; }

/* ---------- New bet button ---------- */
.fab-wrap {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; pointer-events: none;
  padding: 24px calc(var(--gutter) + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(var(--gutter) + env(safe-area-inset-left));
  background: linear-gradient(to top, var(--bg) 40%, transparent);
}
.fab {
  pointer-events: auto; display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; max-width: 528px; margin: 0 auto; height: 56px; border: 0; border-radius: 16px;
  background: var(--accent); color: var(--on-accent);
  font-family: var(--num); font-size: 20px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  box-shadow: 0 10px 28px color-mix(in srgb, var(--accent) 30%, transparent);
  transition: transform .12s;
}
.fab:active { transform: scale(.98); }
.fab svg { width: 20px; height: 20px; }

/* ---------- Sheet ---------- */
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); opacity: 0; transition: opacity .22s; }
.scrim.open { opacity: 1; }
.sheet {
  position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 560px;
  height: calc(100dvh - env(safe-area-inset-top) - 24px);
  background: var(--surface); border-radius: 22px 22px 0 0; border: 1px solid var(--line); border-bottom: 0;
  display: flex; flex-direction: column;
  transform: translateY(100%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
  padding-bottom: env(safe-area-inset-bottom);
}
.sheet.open { transform: none; }
.sheet-head { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; padding: 10px 10px 6px; }
.sheet-head h2 { margin: 0; text-align: center; font-family: var(--num); font-size: 20px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet-head h2 span { color: var(--muted); }
.icon-btn { width: 40px; height: 40px; border: 0; background: none; border-radius: 12px; display: grid; place-items: center; color: var(--muted); }
.icon-btn:active { background: var(--surface-2); }
.icon-btn svg { width: 22px; height: 22px; }
.step { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 6px var(--gutter) 16px; overflow-y: auto; }

.search { display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 14px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); flex: none; }
.search:focus-within { border-color: var(--accent); }
.search svg { width: 19px; height: 19px; color: var(--muted); flex: none; }
.search input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; outline: none; font-size: 17px; }
.search input::-webkit-search-cancel-button { display: none; }
.results { list-style: none; margin: 10px 0 0; padding: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.results li button {
  width: 100%; display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center;
  padding: 9px 6px; border: 0; background: none; border-radius: 12px; text-align: left;
}
.results li button:active, .results li button:focus-visible { background: var(--surface-2); outline: none; }
.results .avatar { width: 44px; height: 44px; }
.r-name { font-weight: 600; font-size: 16px; }
.r-sub { font-size: 13px; color: var(--muted); }
.r-pos { font-family: var(--num); font-weight: 600; font-size: 14px; color: var(--muted); letter-spacing: .04em; }
.hint { color: var(--muted); font-size: 14px; text-align: center; margin: 22px 0 0; }
.hint button { margin-top: 10px; }
.sheet-lines { margin-top: auto; padding-top: 14px; font-size: 13px; color: var(--muted); }
.sheet-lines b { color: var(--text); font-weight: 600; }

.picked { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; padding: 6px 0 14px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.picked .avatar { width: 56px; height: 56px; }
.picked .p-name { font-size: 19px; font-weight: 600; }
.picked .p-sub { font-size: 13.5px; color: var(--muted); }
.field { border: 0; margin: 0 0 14px; padding: 0; min-width: 0; }
.field legend, .field .lbl { font-size: 11.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; padding: 0; display: block; }
.seg { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label {
  display: grid; place-items: center; height: 44px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface-2); font-weight: 600; font-size: 15px; cursor: pointer; user-select: none; transition: background .15s, border-color .15s, color .15s;
}
.seg input:checked + label { background: var(--text); color: var(--bg); border-color: var(--text); }
.seg input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg .grp { grid-column: 1 / -1; font-size: 10.5px; font-weight: 700; letter-spacing: .14em; color: var(--faint); text-transform: uppercase; margin: 4px 0 -2px; }
.line-wrap { display: grid; grid-template-columns: 56px 1fr 56px; gap: 6px; }
.line-wrap button { height: 58px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-size: 24px; font-weight: 500; }
.line-wrap button:active { background: var(--line); }
.line-wrap input {
  height: 58px; min-width: 0; text-align: center; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2);
  font-family: var(--num); font-size: 32px; font-weight: 700; outline: none; font-variant-numeric: tabular-nums;
}
.line-wrap input:focus { border-color: var(--accent); }
.err { color: var(--bad); font-size: 13px; margin-top: 6px; min-height: 18px; }
.actions { margin-top: auto; display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; padding-top: 6px; }
.primary, .secondary {
  height: 56px; border-radius: 16px; font-family: var(--num); font-size: 19px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
}
.primary { border: 0; background: var(--accent); color: var(--on-accent); }
.secondary { border: 1px solid var(--line); background: var(--surface-2); color: var(--text); }
.primary:active, .secondary:active { transform: scale(.99); }

/* ---------- Toast ---------- */
.toast {
  position: fixed; z-index: 30; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom));
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  display: flex; align-items: center; gap: 14px; padding: 10px 10px 10px 16px; border-radius: 14px;
  background: var(--toast-bg); color: var(--toast-text); font-size: 14.5px; font-weight: 500; white-space: nowrap;
  box-shadow: 0 10px 30px rgba(0,0,0,.35); transition: transform .22s, opacity .22s;
}
.toast.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
.toast button { border: 0; background: none; color: var(--toast-action); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: 13px; padding: 6px 8px; border-radius: 8px; }

/* ---------- Debug ---------- */
.debug {
  max-width: 560px; margin: 10px auto 0; padding: 12px; border: 1px dashed var(--accent); border-radius: 14px;
  font-size: 13px; color: var(--muted); display: grid; gap: 8px;
}
.debug .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.debug input, .debug select { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; color: var(--text); font: inherit; min-width: 0; }
.debug input { flex: 1; }
.debug button { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-weight: 600; font-size: 12.5px; }
.debug .chips { display: flex; gap: 6px; flex-wrap: wrap; }
.debug .chips button { font-weight: 500; }
.debug strong { color: var(--accent); letter-spacing: .1em; font-size: 11px; }

@media (min-width: 600px) {
  .l-val .yds { font-size: 54px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand" aria-label="YardTrack">

      <span>Yard<b>Track</b></span>

    <rect x="18" y="28" width="52" height="7" rx="3.5" fill="var(--track)"/><rect x="18" y="28" width="34" height="7" rx="3.5" fill="var(--fill)"/>
    <rect x="18" y="41" width="52" height="7" rx="3.5" fill="var(--accent)"/>

        <input type="radio" name="stat" id="st-ptd" value="ptd"><label for="st-ptd">Passing TDs</label>

        <input id="line" type="text" inputmode="decimal" placeholder="74.5" autocomplete="off" enterkeyhint="done">
        <button type="button" data-step="0.5" aria-label="Increase line by 0.5">+</button>

<div class="toast" id="toast" role="status"><span id="toastTxt"></span><button id="toastUndo">Undo</button></div>

<script>
(() => {
'use strict';

/* ================= Config & storage ================= */
const API = '/.netlify/functions/espn';
const KEYS = { slips: 'yt.slips.v1', legacyBets: 'yt.bets.v1', players: 'yt.players.v1', games: 'yt.games.v2', theme: 'yt.theme' };
const PLAYERS_TTL = 12 * 60 * 60 * 1000;
const LIVE_MS = 30 * 1000;
const SCOREBOARD_MS = 5 * 60 * 1000;
const STATS = {
  pass: { label: 'Pass Yds', get: (s) => s.pass },
  rush: { label: 'Rush Yds', get: (s) => s.rush },
  rec:  { label: 'Rec Yds', get: (s) => s.rec },
  rr:   { label: 'Rush + Rec Yds', get: (s) => s.rush + s.rec },
  td:   { label: 'TDs', td: true, get: (s) => s.rushTd + s.recTd },
  ptd:  { label: 'Pass TDs', td: true, get: (s) => s.passTd },
};
const DEFAULT_STAT = { QB: 'pass', RB: 'rush', FB: 'rush', WR: 'rec', TE: 'rec' };

const store = {
  get(key, fallback) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch { return false; }
  },
  remove(key) {
    try { localStorage.removeItem(key); } catch { /* ignore */ }
  },
};

const params = new URLSearchParams(location.search);
const DEBUG = params.get('debug') === '1';
const debug = { event: params.get('event') || '', force: params.get('force') || 'auto', box: [] };
const uid = () => `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}`;

/* ================= State ================= */
// A slip is one bet ("Bet 1") holding one or more legs (player lines).
let slips = store.get(KEYS.slips, null);
if (!Array.isArray(slips)) {
  // Migrate v1 single bets into one slip so nothing is lost.
  const old = store.get(KEYS.legacyBets, []);
  slips = Array.isArray(old) && old.length ? [{ id: uid(), name: 'Bet 1', createdAt: Date.now(), legs: old }] : [];
  store.set(KEYS.slips, slips);
  store.remove(KEYS.legacyBets);
}
slips = slips.filter((s) => s && Array.isArray(s.legs));
let games = store.get(KEYS.games, {}) || {};
let players = [];
let playersState = 'loading'; // loading | ready | error
let teamEvent = {};           // teamId -> eventId for the current scoreboard week
let sbLoaded = false, sbFailed = false, sbAt = 0;
let lastUpdated = 0, netError = false;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9 ]/g, '');
const fmtNum = (n) => (Math.round(n * 10) / 10).toLocaleString('en-GB', { maximumFractionDigits: 1 });
const allLegs = () => slips.flatMap((s) => s.legs);

function saveSlips() { store.set(KEYS.slips, slips); }
function saveGames() {
  // Persist only games a leg points at, so storage never grows week on week.
  const keep = {};
  for (const l of allLegs()) if (l.eventId && games[l.eventId]) keep[l.eventId] = games[l.eventId];
  store.set(KEYS.games, keep);
}

/* ================= Theme ================= */
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>';
function applyTheme() {
  const light = document.documentElement.dataset.theme === 'light';
  $('themeBtn').innerHTML = light ? MOON : SUN;
  $('themeBtn').setAttribute('aria-label', light ? 'Switch to dark mode' : 'Switch to light mode');
  $('themeColor').setAttribute('content', light ? '#f3f4f6' : '#0a0c0f');
}
$('themeBtn').addEventListener('click', () => {
  const light = document.documentElement.dataset.theme !== 'light';
  if (light) document.documentElement.dataset.theme = 'light';
  else delete document.documentElement.dataset.theme;
  try { localStorage.setItem(KEYS.theme, light ? 'light' : 'dark'); } catch { /* ignore */ } // raw string, read by the head script
  applyTheme();
});
applyTheme();

/* ================= API ================= */
// Primary path is the Netlify proxy (CDN caching). If it is missing or failing (ESPN has been
// seen refusing Netlify's servers) fall back to ESPN directly, which currently allows CORS.
const ESPN = 'https://site.api.espn.com/apis/site/v2/sports/football/nfl';
let direct = location.protocol === 'file:';

async function getJSON(url, ms = 12000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  try {
    const res = await fetch(url, { signal: ctrl.signal });
    const body = await res.json().catch(() => undefined);
    return { res, body };
  } finally {
    clearTimeout(timer);
  }
}

async function api(query) {
  if (direct) return apiDirect(query);
  let proxyErr;
  try {
    const { res, body } = await getJSON(`${API}?${new URLSearchParams(query)}`);
    if (res.ok && body !== undefined) return body;
    // A 400/404 from our own function (bad ID) is a real answer, not a proxy outage.
    if (body?.error && (res.status === 400 || res.status === 404)) throw Object.assign(new Error(body.error), { final: true });
    proxyErr = new Error(body?.error || `Proxy HTTP ${res.status}`);
  } catch (err) {
    if (err.final) throw err;
    proxyErr = err;
  }
  try {
    const body = await apiDirect(query);
    console.warn('Proxy failed, using direct ESPN for this session:', proxyErr.message);
    direct = true;
    return body;
  } catch {
    throw proxyErr;
  }
}

async function espn(path) {
  const { res, body } = await getJSON(`${ESPN}${path}`);
  if (!res.ok || body === undefined) throw new Error(`ESPN ${res.status}`);
  return body;
}

async function apiDirect(q) {
  switch (q.route) {
    case 'scoreboard': return espn(`/scoreboard${q.dates ? `?dates=${q.dates}` : ''}`);
    case 'summary': return espn(`/summary?event=${encodeURIComponent(q.event)}`);
    case 'players': {
      // ESPN's /teams sends no CORS header (rosters do), so use the stable franchise IDs.
      const teams = [22, 1, 33, 2, 29, 3, 4, 5, 6, 7, 8, 9, 34, 11, 30, 12, 13, 24, 14, 15, 16, 17, 18, 19, 20, 21, 23, 25, 26, 27, 10, 28];
      const rosters = await Promise.allSettled(teams.map((id) => espn(`/teams/${id}/roster`)));
      const out = [], seen = new Set();
      rosters.forEach((r, i) => {
        if (r.status !== 'fulfilled') return;
        for (const group of r.value?.athletes || []) for (const a of group.items || []) {
          const pos = a?.position?.abbreviation;
          if (!DEFAULT_STAT[pos] || seen.has(a.id)) continue;
          seen.add(a.id);
          out.push({ id: String(a.id), name: a.displayName || a.fullName, position: pos, teamId: String(teams[i]), teamAbbr: r.value?.team?.abbreviation || '', headshot: a?.headshot?.href || null });
        }
      });
      return out.sort((a, b) => a.name.localeCompare(b.name));
    }
    default: throw new Error(`Unknown route ${q.route}`);
  }
}

/* ================= Players index ================= */
async function loadPlayers() {
  const cached = store.get(KEYS.players, null);
  const valid = cached && Array.isArray(cached.data) && cached.data.length;
  if (valid && Date.now() - cached.t < PLAYERS_TTL) {
    setPlayers(cached.data);
    return;
  }
  playersState = 'loading';
  renderResults();
  try {
    const data = await api({ route: 'players' });
    if (!Array.isArray(data) || !data.length) throw new Error('Empty player index');
    store.set(KEYS.players, { t: Date.now(), data });
    setPlayers(data);
  } catch (err) {
    console.warn('players', err);
    if (valid) setPlayers(cached.data); // stale beats nothing
    else { playersState = 'error'; renderResults(); }
  }
}
function setPlayers(data) {
  players = data.map((p) => ({ ...p, _k: norm(p.name) }));
  playersState = 'ready';
  renderResults();
}

/* ================= ESPN parsing ================= */
function upsertGame(id, comp, fallbackDate) {
  if (!id || !comp) return null;
  const g = games[id] || (games[id] = { id: String(id), stats: {} });
  const st = comp.status || {};
  g.date = comp.date || fallbackDate || g.date;
  g.state = st.type?.state || g.state || 'pre';
  g.statusName = st.type?.name || g.statusName || '';
  g.detail = st.type?.shortDetail || st.type?.detail || '';
  if (st.period != null) g.period = st.period;
  g.clock = st.displayClock || '';
  const teams = (comp.competitors || []).map((c) => ({
    id: String(c.team?.id ?? c.id),
    abbr: c.team?.abbreviation || '',
    homeAway: c.homeAway,
    score: c.score ?? '',
  }));
  if (teams.length) g.teams = teams;
  return g;
}

// boxscore.players[] -> { athleteId: { pass, rush, rec, passTd, rushTd, recTd } }.
// Columns are found by key (e.g. rushingYards / rushingTouchdowns) or label, never by index.
const blankStats = () => ({ pass: 0, rush: 0, rec: 0, passTd: 0, rushTd: 0, recTd: 0 });
function parseBox(summary) {
  const stats = {};
  const roster = [];
  let found = false;
  const col = (cat, key, label) => {
    let i = (cat.keys || []).indexOf(key);
    if (i < 0) i = (cat.labels || []).findIndex((l) => String(l).toUpperCase() === label);
    return i;
  };
  const num = (v) => { const n = parseInt(String(v ?? '').replace(/,/g, ''), 10); return Number.isFinite(n) ? n : 0; };
  for (const team of summary?.boxscore?.players || []) {
    for (const cat of team.statistics || []) {
      const short = { passing: 'pass', rushing: 'rush', receiving: 'rec' }[cat.name];
      if (!short) continue;
      found = true;
      const yi = col(cat, `${cat.name}Yards`, 'YDS');
      const ti = col(cat, `${cat.name}Touchdowns`, 'TD');
      for (const row of cat.athletes || []) {
        const id = String(row.athlete?.id || '');
        if (!id) continue;
        const s = stats[id] || (stats[id] = blankStats());
        if (yi >= 0) s[short] = num(row.stats?.[yi]);
        if (ti >= 0) s[`${short}Td`] = num(row.stats?.[ti]);
        if (DEBUG) roster.push({ id, name: row.athlete.displayName, headshot: row.athlete.headshot?.href || null, teamId: String(team.team?.id), teamAbbr: team.team?.abbreviation, cat: short, yds: s[short] });
      }
    }
  }
  return { found, stats, roster };
}

/* ================= Data flow ================= */
async function refreshScoreboard() {
  const sb = await api({ route: 'scoreboard' });
  const map = {};
  for (const ev of sb?.events || []) {
    const comp = ev.competitions?.[0];
    if (!comp) continue;
    if (!comp.status) comp.status = ev.status;
    upsertGame(String(ev.id), comp, ev.date);
    for (const c of comp.competitors || []) map[String(c.team?.id ?? c.id)] = String(ev.id);
  }
  teamEvent = map;
  sbLoaded = true;
  sbFailed = false;
  sbAt = Date.now();
}

async function fetchSummary(id) {
  const sum = await api({ route: 'summary', event: id });
  const comp = sum?.header?.competitions?.[0];
  const g = upsertGame(id, comp, comp?.date) || games[id] || (games[id] = { id, stats: {} });
  const box = parseBox(sum);
  if (box.found) g.stats = box.stats; // never wipe good numbers with an empty payload
  g.fetchedAt = Date.now();
  g.finalFetched = g.state === 'post';
  if (DEBUG && id === debug.event) { debug.box = box.roster; renderDebug(); }
  return g;
}

// Tie each leg to an event. Once its game has kicked off the link is locked, so finished
// legs stay attached to their game after ESPN rolls the scoreboard to the next week.
function bindLegs() {
  if (!sbLoaded) return;
  for (const l of allLegs()) {
    const cur = l.eventId ? games[l.eventId] : null;
    if (cur && cur.state !== 'pre') continue;
    l.eventId = teamEvent[l.teamId] || null;
  }
}

function eventFor(l) {
  if (DEBUG && debug.event) {
    const g = games[debug.event];
    if (g?.teams?.some((t) => t.id === l.teamId)) return debug.event;
  }
  return l.eventId || null;
}

function stateOf(g) {
  if (!g) return null;
  if (DEBUG && debug.force !== 'auto' && g.id === debug.event) return debug.force;
  return g.state;
}

// One summary per game per cycle, only for games that can still change.
function gamesToPoll() {
  const now = Date.now();
  const ids = new Set();
  for (const l of allLegs()) {
    const id = eventFor(l);
    if (!id) continue;
    const g = games[id];
    if (!g) { ids.add(id); continue; }
    if (g.state === 'in') ids.add(id);
    else if (g.state === 'post' && !g.finalFetched) ids.add(id);
    else if (g.state === 'pre' && g.date && Date.parse(g.date) <= now) ids.add(id); // catch kick-off early
  }
  if (DEBUG && debug.event) {
    const g = games[debug.event];
    if (!g || g.state !== 'post' || !g.finalFetched) ids.add(debug.event);
  }
  return [...ids];
}

let busy = false, queued = null;
async function cycle(withScoreboard) {
  if (busy) { queued = queued === null ? withScoreboard : (queued || withScoreboard); return; }
  busy = true;
  let ok = 0, failed = 0;
  try {
    if (withScoreboard || !sbLoaded) {
      try { await refreshScoreboard(); ok++; } catch (err) { console.warn('scoreboard', err); sbFailed = !sbLoaded; failed++; }
    }
    bindLegs();
    const results = await Promise.allSettled(gamesToPoll().map(fetchSummary));
    for (const r of results) {
      if (r.status === 'fulfilled') ok++;
      else { failed++; console.warn('summary', r.reason); }
    }
    bindLegs();
    netError = failed > 0;
    if (ok && !failed) lastUpdated = Date.now();
    saveSlips();
    saveGames();
    render();
  } finally {
    busy = false;
    if (queued !== null) { const q = queued; queued = null; cycle(q); }
  }
}

let liveTimer = null, sbTimer = null;
function startTimers() {
  stopTimers();
  liveTimer = setInterval(() => cycle(false), LIVE_MS);
  sbTimer = setInterval(() => cycle(true), SCOREBOARD_MS);
}
function stopTimers() {
  clearInterval(liveTimer);
  clearInterval(sbTimer);
  liveTimer = sbTimer = null;
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { stopTimers(); return; }
  cycle(Date.now() - sbAt > 60 * 1000);
  startTimers();
});

/* ================= Leg / slip logic ================= */
const LONDON = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
function kickoff(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return 'TBC';
  const p = Object.fromEntries(LONDON.formatToParts(d).map((x) => [x.type, x.value]));
  return `${p.weekday} ${p.day} ${String(p.month).slice(0, 3)} · ${p.hour}:${p.minute}`;
}

function clockText(g) {
  const name = g.statusName || '';
  if (name === 'STATUS_HALFTIME') return 'Halftime';
  const p = g.period || 0;
  const q = p > 4 ? (p > 5 ? `${p - 4}OT` : 'OT') : p ? `Q${p}` : '';
  if (name === 'STATUS_END_PERIOD') return q ? `End ${q}` : 'End of quarter';
  if (q && g.clock) return `${q} ${g.clock}`;
  return g.detail || 'Live';
}

function scoreText(g, forTeamId) {
  if (!g.teams || g.teams.length < 2) return '';
  const me = g.teams.find((t) => t.id === forTeamId) || g.teams[0];
  const opp = g.teams.find((t) => t !== me);
  if (me.score === '' || opp.score === '') return '';
  return `${esc(me.abbr)} ${esc(me.score)}–${esc(opp.score)} ${esc(opp.abbr)}`;
}

function valueFor(l, g) {
  const s = g?.stats?.[l.playerId];
  const def = STATS[l.stat];
  return s && def ? def.get({ ...blankStats(), ...s }) || 0 : 0;
}

function toneFor(l, y, state) {
  const over = y > l.line, under = y < l.line;
  if (state === 'post') {
    if (!over && !under) return 'push';
    return (l.side === 'over' ? over : under) ? 'good' : 'bad';
  }
  if (state === 'in' && over) return l.side === 'over' ? 'good' : 'bad';
  return 'neutral';
}

function viewFor(l) {
  const id = eventFor(l);
  const g = id ? games[id] : null;
  const state = stateOf(g);
  if (!g) {
    const kind = sbLoaded ? 'bye' : sbFailed ? 'unknown' : 'loading';
    return { g: null, state: kind, rank: kind === 'bye' ? 4 : 2, y: 0, tone: 'neutral' };
  }
  const y = state === 'pre' ? 0 : valueFor(l, g);
  return { g, state, rank: state === 'in' ? 0 : state === 'pre' ? 1 : 3, y, tone: toneFor(l, y, state) };
}

// Treats a slip as an accumulator: any lost leg loses it, every leg must land to win (pushes void).
function slipSummary(slip) {
  const views = slip.legs.map((l) => ({ l, v: viewFor(l) }));
  const n = views.length;
  const hit = views.filter((x) => x.v.tone === 'good').length;
  const lost = views.some((x) => x.v.tone === 'bad');
  const allFinal = n > 0 && views.every((x) => x.v.state === 'post' || x.v.state === 'bye');
  const live = views.some((x) => x.v.state === 'in');
  const upcoming = views.some((x) => x.v.state === 'pre');
  let status, tone;
  if (!n) { status = 'Empty'; tone = 'pending'; }
  else if (lost) { status = 'Lost'; tone = 'bad'; }
  else if (allFinal) {
    const graded = views.filter((x) => x.v.state === 'post' && x.v.tone !== 'push');
    status = graded.length ? 'Won' : 'Void';
    tone = graded.length ? 'good' : 'push';
  } else if (live) { status = 'Live'; tone = 'live'; }
  else if (upcoming) { status = 'Upcoming'; tone = 'pending'; }
  else { status = 'Pending'; tone = 'pending'; }
  const firstKick = Math.min(...views.map((x) => Date.parse(x.v.g?.date || '') || Infinity));
  const rank = allFinal || (lost && !live) ? 3 : live ? 0 : upcoming ? 1 : 2;
  return { views, n, hit, lost, allFinal, live, status, tone, rank, firstKick };
}

function nextSlipName() {
  const nums = slips.map((s) => +((/^Bet (\d+)$/i.exec(s.name) || [])[1] || 0));
  return `Bet ${Math.max(0, ...nums) + 1}`;
}

/* ================= Rendering ================= */
const slipEls = new Map();
const legEls = new Map();
const lastTone = new Map();

function initials(name) {
  return String(name || '?').split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
}
function headshot(url, w = 128) {
  if (!url) return '';
  const m = String(url).match(/espncdn\.com(\/i\/headshots\/[^?]+)/);
  return m ? `https://a.espncdn.com/combiner/i?img=${m[1]}&w=${w}&h=${Math.round(w * 0.727)}&scale=crop&cquality=40` : url;
}
function avatarHTML(p, size = 128) {
  const src = headshot(p.headshot, size);
  return `<div class="avatar${src ? '' : ' noimg'}" data-initials="${esc(initials(p.name))}">${src ? `<img src="${esc(src)}" alt="" loading="lazy" decoding="async" onerror="this.parentNode.classList.add('noimg');this.remove()">` : ''}</div>`;
}

const TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>';
const CROSS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';
const PENCIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
const PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';

function createSlip(slip) {
  const el = document.createElement('section');
  el.className = 'slip';
  el.dataset.id = slip.id;
  el.innerHTML = `
    <header class="s-head">
      <button class="s-name" aria-label="Rename bet"><span></span>${PENCIL}</button>
      <span class="s-count"></span>
      <span class="s-spacer"></span>
      <span class="s-badge"></span>
      <button class="del-btn s-del" aria-label="Delete bet">${TRASH}</button>
    </header>
    <div class="s-legs"></div>
    <div class="s-empty" hidden>No lines yet.</div>
    <button class="s-add">${PLUS}Add line</button>`;
  el.querySelector('.s-name').addEventListener('click', () => renameSlip(slip.id));
  el.querySelector('.s-del').addEventListener('click', () => deleteSlip(slip.id));
  el.querySelector('.s-add').addEventListener('click', () => openSheet(slip.id));
  return el;
}

function updateSlip(el, slip, sum) {
  el.classList.toggle('won', sum.status === 'Won');
  el.classList.toggle('lost', sum.status === 'Lost');
  el.querySelector('.s-name span').textContent = slip.name;
  el.querySelector('.s-name').setAttribute('aria-label', `Rename ${slip.name}`);
  el.querySelector('.s-count').textContent = sum.n ? `${sum.hit}/${sum.n} hit` : '';
  const badge = el.querySelector('.s-badge');
  badge.className = `s-badge badge ${sum.tone}`;
  badge.textContent = sum.status;
  el.querySelector('.s-del').setAttribute('aria-label', `Delete ${slip.name}`);
  el.querySelector('.s-empty').hidden = sum.n > 0;
}

function createLeg(slip, l) {
  const el = document.createElement('div');
  el.className = 'leg';
  el.dataset.id = l.id;
  const def = STATS[l.stat] || STATS.rec;
  el.innerHTML = `
    <div class="l-head">
      ${avatarHTML(l, 96)}
      <div class="l-who">
        <div class="l-name">${esc(l.name)}<small></small></div>
        <div class="l-bet"><span class="side">${l.side === 'over' ? 'Over' : 'Under'}</span> <span class="num">${fmtNum(l.line)}</span> ${def.label}</div>
      </div>
      <div class="l-val"><span class="yds">0</span><span class="unit">${def.td ? 'TD' : 'Yds'}</span></div>
    </div>
    <div class="bar${def.td ? ' td' : ''}" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div class="fill"></div><div class="ticks"></div></div>
    <div class="l-foot"><span class="l-status"></span><span class="l-delta"></span><span class="l-badge"></span><button class="del-btn" aria-label="Remove line">${CROSS}</button></div>`;
  el.querySelector('.del-btn').addEventListener('click', () => deleteLeg(slip.id, l.id));
  return el;
}

function deltaText(l, y, def) {
  const diff = y - l.line;
  if (diff > 0) return `+${fmtNum(diff)}`;
  if (diff === 0) return 'On the line';
  const unit = (n) => (def.td ? (n === 1 ? ' TD' : ' TDs') : '');
  if (l.side === 'over') {
    const need = Math.floor(l.line) + 1 - y; // smallest whole number that clears the line
    return `${need}${unit(need)} to go`;
  }
  const spare = Math.ceil(l.line) - 1 - y; // how many more before the under loses
  return spare > 0 ? `${spare}${unit(spare)} spare` : 'No room left';
}

function updateLeg(el, l, v) {
  const { g, state, y, tone } = v;
  const def = STATS[l.stat] || STATS.rec;
  el.classList.remove('good', 'bad');
  if (tone === 'good' || tone === 'bad') el.classList.add(tone);

  // Flash only on a real change seen live (e.g. the moment an Over hits), not on first load.
  if (g) {
    const prev = lastTone.get(l.id);
    if (prev && prev !== tone && tone !== 'neutral') { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
    lastTone.set(l.id, tone);
  }

  let opp = '';
  if (g?.teams?.length === 2) {
    const me = g.teams.find((t) => t.id === l.teamId);
    const other = g.teams.find((t) => t.id !== l.teamId);
    if (other) opp = `${me?.homeAway === 'home' ? 'vs' : '@'} ${other.abbr}`;
  }
  el.querySelector('.l-name small').textContent = `${l.teamAbbr}${opp ? ` ${opp}` : ''}`;

  const noGame = !g;
  const ydsEl = el.querySelector('.yds');
  ydsEl.textContent = noGame ? '—' : String(y);
  ydsEl.classList.toggle('dim', noGame || state === 'pre');

  const pct = l.line > 0 ? Math.max(0, Math.min(1, y / l.line)) : 0;
  el.querySelector('.fill').style.width = `${pct * 100}%`;
  el.querySelector('.bar').setAttribute('aria-valuenow', Math.round(pct * 100));

  el.querySelector('.l-delta').textContent = !noGame && state !== 'pre' ? deltaText(l, y, def) : '';

  let status;
  if (state === 'bye') status = 'No game this week';
  else if (state === 'loading') status = 'Loading schedule…';
  else if (state === 'unknown') status = 'Schedule unavailable';
  else if (state === 'pre') status = esc(kickoff(g.date));
  else if (state === 'in') {
    const sc = scoreText(g, l.teamId);
    status = `<span class="live-dot"></span>${esc(clockText(g))}${sc ? ` · <span class="score">${sc}</span>` : ''}`;
  } else {
    const sc = scoreText(g, l.teamId);
    const ot = /OT/i.test(g.detail || '') ? '/OT' : '';
    status = `Final${ot}${sc ? ` · <span class="score">${sc}</span>` : ''}`;
  }
  el.querySelector('.l-status').innerHTML = status;

  const badge = el.querySelector('.l-badge');
  if (state === 'post') {
    badge.className = `l-badge badge ${tone}`;
    badge.textContent = tone === 'good' ? 'Hit' : tone === 'bad' ? 'Miss' : 'Push';
  } else {
    badge.className = 'l-badge';
    badge.textContent = '';
  }
}

function render() {
  const main = $('slips');
  const sums = slips.map((s) => ({ s, sum: slipSummary(s) }));
  sums.sort((a, b) => a.sum.rank - b.sum.rank || a.sum.firstKick - b.sum.firstKick || a.s.createdAt - b.s.createdAt);

  const liveSlips = new Set(slips.map((s) => s.id));
  const liveLegs = new Set(allLegs().map((l) => l.id));
  for (const [id, el] of slipEls) if (!liveSlips.has(id)) { el.remove(); slipEls.delete(id); }
  for (const [id, el] of legEls) if (!liveLegs.has(id)) { el.remove(); legEls.delete(id); lastTone.delete(id); }

  for (const { s, sum } of sums) {
    let el = slipEls.get(s.id);
    if (!el) { el = createSlip(s); slipEls.set(s.id, el); }
    updateSlip(el, s, sum);
    const box = el.querySelector('.s-legs');
    const legs = [...sum.views].sort((a, b) =>
      a.v.rank - b.v.rank ||
      (Date.parse(a.v.g?.date || 0) || 0) - (Date.parse(b.v.g?.date || 0) || 0) ||
      a.l.createdAt - b.l.createdAt);
    for (const { l, v } of legs) {
      let le = legEls.get(l.id);
      if (!le) { le = createLeg(s, l); legEls.set(l.id, le); }
      updateLeg(le, l, v);
      box.appendChild(le); // re-appending keeps sort order without rebuilding
    }
    main.appendChild(el);
  }

  $('empty').hidden = slips.length > 0;
  $('toolbar').hidden = slips.length === 0;

  const count = (fn) => sums.filter(fn).length;
  const live = count((x) => x.sum.live && !x.sum.lost);
  const won = count((x) => x.sum.status === 'Won');
  const lost = count((x) => x.sum.status === 'Lost');
  const upcoming = count((x) => x.sum.status === 'Upcoming');
  $('tally').innerHTML =
    (live ? `<span class="t-live"><b>${live}</b>Live</span>` : '') +
    (upcoming ? `<span><b>${upcoming}</b>Upcoming</span>` : '') +
    (won ? `<span class="t-won"><b>${won}</b>Won</span>` : '') +
    (lost ? `<span class="t-lost"><b>${lost}</b>Lost</span>` : '');
  $('clearFinished').hidden = !sums.some((x) => x.sum.allFinal);

  $('netwarn').hidden = !netError;
  renderFresh();
}

function renderFresh() {
  const el = $('fresh');
  el.classList.toggle('ok', !!lastUpdated && !netError);
  el.classList.toggle('warn', netError);
  let txt;
  if (!lastUpdated) txt = netError ? 'Offline' : 'Connecting…';
  else {
    const s = Math.max(0, Math.round((Date.now() - lastUpdated) / 1000));
    txt = s < 5 ? 'Updated just now' : s < 60 ? `Updated ${s}s ago` : s < 3600 ? `Updated ${Math.floor(s / 60)}m ago` : `Updated ${Math.floor(s / 3600)}h ago`;
  }
  $('freshTxt').textContent = txt;
}
setInterval(renderFresh, 1000);

/* ================= Edit / delete / undo ================= */
let toastTimer = null, undoFn = null;
function toast(msg, onUndo) {
  $('toastTxt').textContent = msg;
  $('toastUndo').hidden = !onUndo;
  undoFn = onUndo || null;
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 5000);
}
function hideToast() { $('toast').classList.remove('show'); undoFn = null; }
$('toastUndo').addEventListener('click', () => { if (undoFn) undoFn(); hideToast(); });

// Every destructive change snapshots the slips so Undo is a straight restore.
function mutate(msg, fn) {
  const snapshot = JSON.stringify(slips);
  fn();
  saveSlips();
  render();
  toast(msg, () => { slips = JSON.parse(snapshot); saveSlips(); saveGames(); render(); });
}
function deleteSlip(id) {
  const s = slips.find((x) => x.id === id);
  if (!s) return;
  mutate(`${s.name} deleted`, () => { slips = slips.filter((x) => x.id !== id); });
}
function deleteLeg(slipId, legId) {
  const s = slips.find((x) => x.id === slipId);
  if (!s) return;
  const leg = s.legs.find((l) => l.id === legId);
  mutate(`${leg?.name || 'Line'} removed from ${s.name}`, () => {
    s.legs = s.legs.filter((l) => l.id !== legId);
    if (!s.legs.length) slips = slips.filter((x) => x.id !== slipId); // an empty bet is just clutter
  });
}
function renameSlip(id) {
  const s = slips.find((x) => x.id === id);
  if (!s) return;
  const name = window.prompt('Name this bet', s.name);
  if (name == null) return;
  const clean = name.trim().slice(0, 40);
  if (!clean) return;
  s.name = clean;
  saveSlips();
  render();
}
$('clearFinished').addEventListener('click', () => {
  const done = slips.filter((s) => slipSummary(s).allFinal);
  mutate(`Cleared ${done.length} finished bet${done.length === 1 ? '' : 's'}`, () => {
    const ids = new Set(done.map((s) => s.id));
    slips = slips.filter((s) => !ids.has(s.id));
  });
});

/* ================= Add-line sheet ================= */
// target: the slip the line goes into. A new bet is only created when its first line is saved.
let target = { slipId: null, name: '' };
let picked = null;
let lastFocus = null;
let autoLine = false;

function targetSlip() { return slips.find((s) => s.id === target.slipId) || null; }

function openSheet(slipId, player) {
  lastFocus = document.activeElement;
  const s = slipId ? slips.find((x) => x.id === slipId) : null;
  target = s ? { slipId: s.id, name: s.name } : { slipId: null, name: nextSlipName() };
  $('scrim').hidden = false;
  $('sheet').hidden = false;
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(() => { $('scrim').classList.add('open'); $('sheet').classList.add('open'); });
  if (player) pickPlayer(player);
  else showSearch(true);
}
function closeSheet() {
  $('scrim').classList.remove('open');
  $('sheet').classList.remove('open');
  document.body.style.overflow = '';
  setTimeout(() => { $('scrim').hidden = true; $('sheet').hidden = true; }, 280);
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
function setTitle(text) {
  $('sheetTitle').innerHTML = `${esc(target.name)} <span>· ${esc(text)}</span>`;
}
function showSearch(reset) {
  $('stepSearch').hidden = false;
  $('stepForm').hidden = true;
  $('sheetBack').hidden = true;
  setTitle('Add line');
  if (reset) $('q').value = '';
  renderResults();
  const s = targetSlip();
  $('sheetLines').innerHTML = s && s.legs.length
    ? `Already in ${esc(s.name)}: ${s.legs.map((l) => `<b>${esc(l.name)}</b> ${l.side === 'over' ? 'o' : 'u'}${fmtNum(l.line)} ${esc((STATS[l.stat] || {}).label || '')}`).join(', ')}`
    : '';
  setTimeout(() => $('q').focus(), 60);
}

function search(q) {
  const k = norm(q).trim();
  if (!k) return [];
  const out = [];
  for (const p of players) {
    const i = p._k.indexOf(k);
    if (i < 0) continue;
    const wordStart = i === 0 || p._k[i - 1] === ' ';
    const wordEnd = i + k.length === p._k.length || p._k[i + k.length] === ' ';
    const score = wordStart && wordEnd ? 0 : i === 0 ? 1 : wordStart ? 2 : 3;
    out.push([score, p]);
  }
  out.sort((a, b) => a[0] - b[0] || a[1].name.localeCompare(b[1].name));
  return out.slice(0, 8).map((x) => x[1]);
}

function renderResults() {
  const list = $('results'), hint = $('searchHint');
  if (!list) return;
  const q = $('q').value;
  if (playersState === 'loading' && !players.length) { list.innerHTML = ''; hint.textContent = 'Loading players…'; return; }
  if (playersState === 'error' && !players.length) {
    list.innerHTML = '';
    hint.innerHTML = 'Couldn’t load the player list.<br><button class="ghost" type="button" id="retryPlayers">Try again</button>';
    $('retryPlayers').onclick = () => loadPlayers();
    return;
  }
  if (!q.trim()) { list.innerHTML = ''; hint.textContent = `Search ${players.length ? players.length.toLocaleString('en-GB') + ' ' : ''}QBs, RBs, WRs and TEs`; return; }
  const matches = search(q);
  hint.textContent = matches.length ? '' : 'No matching players';
  list.innerHTML = matches.map((p, i) => `
    <li><button type="button" role="option" data-i="${i}">
      ${avatarHTML(p, 96)}
      <span><div class="r-name">${esc(p.name)}</div><div class="r-sub">${esc(p.teamAbbr)}</div></span>
      <span class="r-pos">${esc(p.position)}</span>
    </button></li>`).join('');
  list.querySelectorAll('button').forEach((btn) => btn.addEventListener('click', () => pickPlayer(matches[+btn.dataset.i])));
}
$('q').addEventListener('input', renderResults);
$('q').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); const first = $('results').querySelector('button'); if (first) first.click(); }
});

function pickPlayer(p) {
  picked = p;
  $('stepSearch').hidden = true;
  $('stepForm').hidden = false;
  $('sheetBack').hidden = false;
  setTitle('New line');

  let next = '';
  const evId = teamEvent[p.teamId];
  const g = evId && games[evId];
  if (g?.teams) {
    const me = g.teams.find((t) => t.id === p.teamId);
    const other = g.teams.find((t) => t.id !== p.teamId);
    const when = g.state === 'pre' ? kickoff(g.date) : g.state === 'in' ? 'Live now' : 'Final';
    if (other) next = ` · ${me?.homeAway === 'home' ? 'vs' : '@'} ${esc(other.abbr)} · ${esc(when)}`;
  } else if (sbLoaded) next = ' · No game this week';
  $('picked').innerHTML = `${avatarHTML(p)}<div><div class="p-name">${esc(p.name)}</div><div class="p-sub">${esc(p.position)} · ${esc(p.teamAbbr)}${next}</div></div>`;

  const stat = DEFAULT_STAT[p.position] || 'rec';
  $(`st-${stat}`).checked = true;
  $('sd-over').checked = true;
  $('line').value = '';
  autoLine = false;
  $('lineErr').textContent = '';
  $('saveBtn').textContent = `Save to ${target.name}`;
  setTimeout(() => $('line').focus({ preventScroll: true }), 80);
}

// TD props are almost always 0.5 (anytime) or 1.5, so prefill 0.5 when switching to one.
$('statSeg').addEventListener('change', () => {
  const stat = document.querySelector('input[name="stat"]:checked').value;
  const isTd = !!STATS[stat].td;
  if (isTd && !$('line').value) {
    $('line').value = '0.5';
    autoLine = true;
  } else if (!isTd && autoLine) {
    $('line').value = '';
    autoLine = false;
  }
});
$('line').addEventListener('input', () => { autoLine = false; });

function parseLine(v) {
  const n = parseFloat(String(v).replace(',', '.').trim());
  return Number.isFinite(n) ? n : NaN;
}
document.querySelectorAll('.line-wrap button').forEach((btn) => btn.addEventListener('click', () => {
  const cur = parseLine($('line').value);
  const step = parseFloat(btn.dataset.step);
  const base = Number.isFinite(cur) ? cur : step > 0 ? 0 : 1;
  const nv = Math.max(0.5, Math.round((base + step) * 2) / 2);
  $('line').value = fmtNum(nv).replace(/,/g, '');
  autoLine = false;
  $('lineErr').textContent = '';
}));

$('stepForm').addEventListener('submit', (e) => {
  e.preventDefault();
  if (!picked) return;
  const more = e.submitter?.dataset.more === '1';
  const line = parseLine($('line').value);
  if (!Number.isFinite(line) || line <= 0 || line > 999) {
    $('lineErr').textContent = 'Enter a line greater than 0, e.g. 74.5';
    $('line').focus();
    return;
  }
  let slip = targetSlip();
  if (!slip) {
    slip = { id: uid(), name: target.name, createdAt: Date.now(), legs: [] };
    slips.push(slip);
    target.slipId = slip.id;
  }
  const leg = {
    id: uid(),
    playerId: String(picked.id),
    name: picked.name,
    position: picked.position,
    teamId: String(picked.teamId),
    teamAbbr: picked.teamAbbr,
    headshot: picked.headshot || null,
    stat: document.querySelector('input[name="stat"]:checked').value,
    side: document.querySelector('input[name="side"]:checked').value,
    line: Math.round(line * 10) / 10,
    createdAt: Date.now(),
    eventId: null,
  };
  slip.legs.push(leg);
  bindLegs();
  saveSlips();
  render();
  const label = `${leg.name} ${leg.side === 'over' ? 'over' : 'under'} ${fmtNum(leg.line)} ${STATS[leg.stat].label}`;
  if (more) {
    toast(`Added to ${slip.name}: ${label}`);
    showSearch(true);
  } else {
    closeSheet();
    toast(`Added to ${slip.name}`);
  }
  cycle(false); // pull the game straight away if it's live or finished
});

$('newBetBtn').addEventListener('click', () => openSheet(null));
$('sheetClose').addEventListener('click', closeSheet);
$('scrim').addEventListener('click', closeSheet);
$('sheetBack').addEventListener('click', () => showSearch(false));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('sheet').hidden) closeSheet(); });

/* ================= Debug (?debug=1) ================= */
function setDebugUrl() {
  const p = new URLSearchParams(location.search);
  p.set('debug', '1');
  debug.event ? p.set('event', debug.event) : p.delete('event');
  debug.force !== 'auto' ? p.set('force', debug.force) : p.delete('force');
  history.replaceState(null, '', `${location.pathname}?${p}`);
}
function renderDebug() {
  if (!DEBUG) return;
  const el = $('debug');
  el.hidden = false;
  const g = debug.event && games[debug.event];
  const label = g?.teams ? `${g.teams.map((t) => `${esc(t.abbr)} ${esc(t.score)}`).join(' · ')} (${esc(g.state)})` : debug.event ? 'loading…' : 'none';
  const seen = new Set();
  const box = debug.box.slice().sort((a, b) => b.yds - a.yds).filter((p) => !seen.has(p.id) && seen.add(p.id)).slice(0, 14);
  el.innerHTML = `
    <div class="row"><strong>DEBUG</strong><span>Event: ${label}</span></div>
    <div class="row"><input id="dbgEvent" inputmode="numeric" placeholder="ESPN event ID" value="${esc(debug.event)}"><button id="dbgLoad">Load</button><button id="dbgClear">Clear</button></div>
    <div class="row"><input id="dbgDate" type="date"><button id="dbgList">List games</button>
      <select id="dbgForce" aria-label="Force game state">
        ${['auto', 'pre', 'in', 'post'].map((s) => `<option value="${s}"${debug.force === s ? ' selected' : ''}>state: ${s}</option>`).join('')}
      </select></div>
    <div class="chips" id="dbgGames"></div>
    ${box.length ? `<div>Quick add from this game (new bet):</div><div class="chips" id="dbgBox">${box
      .map((p, i) => `<button data-i="${i}">${esc(p.name)} <span class="num">${p.yds} ${p.cat}</span></button>`).join('')}</div>` : ''}`;
  $('dbgLoad').onclick = () => { debug.event = $('dbgEvent').value.trim(); debug.box = []; setDebugUrl(); renderDebug(); cycle(false); };
  $('dbgClear').onclick = () => { debug.event = ''; debug.box = []; setDebugUrl(); renderDebug(); render(); };
  $('dbgForce').onchange = (e) => { debug.force = e.target.value; setDebugUrl(); render(); };
  $('dbgList').onclick = async () => {
    const d = $('dbgDate').value.replace(/-/g, '');
    if (!/^\d{8}$/.test(d)) return;
    const list = $('dbgGames');
    list.textContent = 'Loading…';
    try {
      const sb = await api({ route: 'scoreboard', dates: d });
      list.innerHTML = (sb.events || []).map((ev) => `<button data-id="${esc(ev.id)}">${esc(ev.shortName)} · ${esc(ev.id)}</button>`).join('') || 'No games that day';
      list.querySelectorAll('button').forEach((b) => (b.onclick = () => { $('dbgEvent').value = b.dataset.id; $('dbgLoad').click(); }));
    } catch (err) { list.textContent = `Error: ${err.message}`; }
  };
  el.querySelectorAll('#dbgBox button').forEach((btn) => (btn.onclick = () => {
    const p = box[+btn.dataset.i];
    const known = players.find((x) => x.id === p.id);
    openSheet(null, known || { ...p, position: { pass: 'QB', rush: 'RB', rec: 'WR' }[p.cat] });
  }));
}

/* ================= Boot ================= */
render();
renderDebug();
loadPlayers();
cycle(true);
startTimers();
})();
</script>
</body>
</html>
